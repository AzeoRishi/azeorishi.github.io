<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishikesh Yadav - Visiting Card</title>
    <!-- Script to convert HTML to PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #0F2027;
            --secondary: #203A43;
            --accent: #2C5364;
            --text-main: #333333;
            --text-light: #666666;
            --bg: #F4F7F6;
            --white: #FFFFFF;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--white);
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border-top: 8px solid var(--secondary);
        }

        .header {
            padding: 40px 30px 20px;
            text-align: center;
        }

        .name {
            font-size: 26px;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .title {
            font-size: 16px;
            color: var(--text-light);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .company {
            font-size: 15px;
            color: var(--accent);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .contact-list {
            padding: 10px 30px 20px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            text-decoration: none;
            color: var(--text-main);
            font-size: 15px;
            transition: color 0.2s;
        }

        .contact-item:hover {
            color: var(--accent);
        }

        .icon-circle {
            width: 36px;
            height: 36px;
            background: #f0f4f8;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .icon-circle svg {
            width: 18px;
            height: 18px;
            fill: var(--secondary);
        }

        .qr-section {
            background: #fafafa;
            padding: 30px;
            text-align: center;
            border-top: 1px solid #eeeeee;
        }

        .qr-wrapper {
            background: var(--white);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            display: inline-block;
            margin-bottom: 15px;
        }

        .qr-wrapper img {
            width: 130px;
            height: 130px;
            display: block;
        }

        .qr-text {
            font-size: 13px;
            color: var(--text-light);
        }

        .actions {
            padding: 20px 30px 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background-color: var(--secondary);
            color: var(--white);
        }

        .btn-primary:hover {
            background-color: var(--primary);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--secondary);
            border: 2px solid var(--secondary);
        }

        .btn-outline:hover {
            background-color: #f0f4f8;
        }
    </style>
</head>
<body>

    <div class="card" id="visiting-card">
        <div class="header">
            <h1 class="name">Rishikesh Yadav</h1>
            <p class="title">Low Cost Automation</p>
            <p class="company">Jindal Steel</p>
        </div>

        <div class="contact-list">
            <!-- Clickable Phone -->
            <a href="tel:+917400569787" class="contact-item">
                <div class="icon-circle">
                    <svg viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/></svg>
                </div>
                +91 7400569787
            </a>
            
            <!-- Clickable Email -->
            <a href="mailto:rishikesh.yadav@jindalsteel.in" class="contact-item">
                <div class="icon-circle">
                    <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                </div>
                rishikesh.yadav@jindalsteel.in
            </a>
        </div>

        <div class="qr-section">
            <div class="qr-wrapper">
                <!-- Ensure the image path is correct in your repo -->
                <img src="images/qrcode-card.png" alt="QR Code">
            </div>
            <p class="qr-text">Scan to view digital card</p>
        </div>

        <div class="actions" id="action-buttons">
            <!-- Downloads VCF file to pre-fill contacts -->
            <button onclick="downloadVCF()" class="btn btn-primary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
                Save Contact
            </button>
            
            <!-- Downloads Card as PNG -->
            <button onclick="downloadPNG()" class="btn btn-outline">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--secondary)"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
                Save Visiting Card
            </button>
        </div>
    </div>

    <script>
        function downloadVCF() {
            // Website removed from this string completely
            const vcardData = `BEGIN:VCARD
VERSION:3.0
N:Yadav;Rishikesh;;;
FN:Rishikesh Yadav
ORG:Jindal Steel
TITLE:Low Cost Automation
TEL;TYPE=CELL,VOICE:+917400569787
EMAIL;TYPE=WORK:rishikesh.yadav@jindalsteel.in
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = 'Rishikesh_Yadav.vcf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function downloadPNG() {
            const card = document.getElementById("visiting-card");
            const actionButtons = document.getElementById("action-buttons");
            
            // Hide the buttons temporarily so they don't show up in the PNG
            actionButtons.style.display = 'none';

            // Take a snapshot of the card
            html2canvas(card, {
                scale: 2, // Increases the resolution of the downloaded image
                useCORS: true, // Helps load local images correctly without breaking
                backgroundColor: "#FFFFFF"
            }).then(canvas => {
                // Restore the buttons
                actionButtons.style.display = 'flex';
                
                // Download the image as a .png
                const link = document.createElement('a');
                link.download = 'Rishikesh_Yadav_Visiting_Card.png';
                link.href = canvas.toDataURL('image/png');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }).catch(err => {
                console.error("Error generating image: ", err);
                actionButtons.style.display = 'flex';
                alert("There was an error generating the image file.");
            });
        }
    </script>
</body>
</html>
