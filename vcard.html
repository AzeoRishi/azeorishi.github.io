<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishikesh Yadav - Visiting Card</title>
    <!-- Script to convert HTML to PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #0F2027;
            --secondary: #203A43;
            --accent: #2C5364;
            --text-main: #333333;
            --text-light: #666666;
            --bg: #F4F7F6;
            --white: #FFFFFF;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--white);
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border-top: 8px solid var(--secondary);
            margin: auto;
        }

        /* The area that will be captured in the PNG */
        #capture-area {
            background-color: var(--white);
            padding-bottom: 10px;
        }

        .header {
            padding: 40px 30px 20px;
            text-align: center;
        }

        .name {
            font-size: 26px;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .title {
            font-size: 16px;
            color: var(--text-light);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .company {
            font-size: 15px;
            color: var(--accent);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .contact-list {
            padding: 10px 30px 20px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            text-decoration: none;
            color: var(--text-main);
            font-size: 15px;
            transition: color 0.2s;
        }

        .contact-item:hover {
            color: var(--accent);
        }

        .icon-circle {
            width: 36px;
            height: 36px;
            background: #f0f4f8;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .icon-circle svg {
            width: 18px;
            height: 18px;
            fill: var(--secondary);
        }

        .qr-section {
            background: #fafafa;
            padding: 30px;
            text-align: center;
            border-top: 1px solid #eeeeee;
        }

        .qr-wrapper {
            background: var(--white);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            display: inline-block;
            margin-bottom: 15px;
        }

        .qr-wrapper img {
            width: 130px;
            height: 130px;
            display: block;
        }

        .qr-text {
            font-size: 13px;
            color: var(--text-light);
        }

        .actions {
            padding: 20px 30px 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background-color: var(--secondary);
            color: var(--white);
        }

        .btn-primary:hover {
            background-color: var(--primary);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--secondary);
            border: 2px solid var(--secondary);
        }

        .btn-outline:hover {
            background-color: #f0f4f8;
        }
    </style>
</head>
<body>

    <div class="card" id="visiting-card">
        
        <!-- TARGET AREA FOR PNG DOWNLOAD -->
        <div id="capture-area">
            <div class="header">
                <h1 class="name">Rishikesh Yadav</h1>
                <p class="title">Low Cost Automation</p>
                <p class="company">Jindal Steel</p>
            </div>

            <div class="contact-list">
                <a href="tel:+917400569787" class="contact-item">
                    <div class="icon-circle">
                        <!-- Solid Phone Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M164.9 24.6c-7.7-18.6-28-28.5-47.4-23.2l-88 24C12.1 30.2 0 46 0 64C0 311.4 200.6 512 448 512c18 0 33.8-12.1 38.6-29.5l24-88c5.3-19.4-4.6-39.7-23.2-47.4l-96-40c-16.3-6.8-35.2-2.1-46.3 11.6L304.7 368C234.3 334.7 177.3 277.7 144 207.3L193.3 167c13.7-11.2 18.4-30 11.6-46.3l-40-96z"/></svg>
                    </div>
                    +91 7400569787
                </a>
                
                <a href="mailto:rishikesh.yadav@jindalsteel.in" class="contact-item">
                    <div class="icon-circle">
                        <!-- Solid Envelope Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M48 64C21.5 64 0 85.5 0 112c0 15.1 7.1 29.3 19.2 38.4L236.8 313.6c11.4 8.5 27 8.5 38.4 0L492.8 150.4c12.1-9.1 19.2-23.3 19.2-38.4c0-26.5-21.5-48-48-48H48zM0 176V384c0 35.3 28.7 64 64 64H448c35.3 0 64-28.7 64-64V176L294.4 339.2c-22.8 17.1-54 17.1-76.8 0L0 176z"/></svg>
                    </div>
                    rishikesh.yadav@jindalsteel.in
                </a>
            </div>
        </div>
        <!-- END OF CAPTURE AREA -->

        <div class="qr-section">
            <div class="qr-wrapper">
                <img src="images/qrcode-card.png" alt="QR Code">
            </div>
            <p class="qr-text">Scan to view digital card</p>
        </div>

        <div class="actions" id="action-buttons">
            <button onclick="downloadVCF()" class="btn btn-primary">
                <!-- Save Contact Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
                Save Contact
            </button>
            
            <button onclick="downloadPNG()" class="btn btn-outline" id="png-btn">
                <!-- Save Image Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="var(--secondary)"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
                Save Visiting Card
            </button>
        </div>
    </div>

    <script>
        function downloadVCF() {
            const vcardData = `BEGIN:VCARD\nVERSION:3.0\nN:Yadav;Rishikesh;;;\nFN:Rishikesh Yadav\nORG:Jindal Steel\nTITLE:Low Cost Automation\nTEL;TYPE=CELL,VOICE:+917400569787\nEMAIL;TYPE=WORK:rishikesh.yadav@jindalsteel.in\nEND:VCARD`;
            
            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = 'Rishikesh_Yadav.vcf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function downloadPNG() {
            // Target ONLY the top capture area
            const captureArea = document.getElementById("capture-area");
            
            html2canvas(captureArea, {
                scale: 3, // High resolution
                backgroundColor: "#FFFFFF"
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Rishikesh_Yadav_Visiting_Card.png';
                link.href = canvas.toDataURL('image/png');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }).catch(err => {
                console.error("Error generating image: ", err);
                alert("There was an error generating the image file.");
            });
        }
    </script>
</body>
</html>
