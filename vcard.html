<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishikesh Yadav - Visiting Card</title>
    <!-- Script to convert HTML to PDF directly -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- FontAwesome for reliable PDF icon rendering -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0F2027;
            --secondary: #203A43;
            --accent: #2C5364;
            --text-main: #333333;
            --text-light: #666666;
            --bg: #F4F7F6;
            --white: #FFFFFF;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--white);
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border-top: 8px solid var(--secondary);
            margin: auto;
        }

        .header {
            padding: 40px 30px 20px;
            text-align: center;
        }

        .name {
            font-size: 26px;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .title {
            font-size: 16px;
            color: var(--text-light);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .company {
            font-size: 15px;
            color: var(--accent);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .contact-list {
            padding: 10px 30px 20px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            text-decoration: none;
            color: var(--text-main);
            font-size: 15px;
            transition: color 0.2s;
        }

        .icon-circle {
            width: 36px;
            height: 36px;
            background: #f0f4f8;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            flex-shrink: 0;
            color: var(--secondary);
            font-size: 16px;
        }

        .qr-section {
            background: #fafafa;
            padding: 30px;
            text-align: center;
            border-top: 1px solid #eeeeee;
        }

        .qr-wrapper {
            background: var(--white);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            display: inline-block;
            margin-bottom: 15px;
        }

        .qr-wrapper img {
            width: 130px;
            height: 130px;
            display: block;
        }

        .qr-text {
            font-size: 13px;
            color: var(--text-light);
        }

        .actions {
            padding: 20px 30px 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background-color: var(--secondary);
            color: var(--white);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--secondary);
            border: 2px solid var(--secondary);
        }
    </style>
</head>
<body>

    <!-- Wrapper specifically for PDF generation -->
    <div id="pdf-wrapper" style="padding: 20px;">
        <div class="card" id="visiting-card">
            <div class="header">
                <h1 class="name">Rishikesh Yadav</h1>
                <p class="title">Low Cost Automation</p>
                <p class="company">Jindal Steel</p>
            </div>

            <div class="contact-list">
                <a href="tel:+917400569787" class="contact-item">
                    <div class="icon-circle">
                        <i class="fa-solid fa-phone"></i>
                    </div>
                    +91 7400569787
                </a>
                
                <a href="mailto:rishikesh.yadav@jindalsteel.in" class="contact-item">
                    <div class="icon-circle">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    rishikesh.yadav@jindalsteel.in
                </a>
            </div>

            <div class="qr-section">
                <div class="qr-wrapper">
                    <!-- Absolute URL to prevent path errors -->
                    <img id="qr-code-img" src="https://azeorishi.github.io/images/qrcode-card.png" alt="QR Code" crossorigin="anonymous">
                </div>
                <p class="qr-text">Scan to view digital card</p>
            </div>

            <div class="actions" id="action-buttons">
                <button onclick="downloadVCF()" class="btn btn-primary">
                    <i class="fa-solid fa-address-book"></i> Save Contact
                </button>
                
                <button onclick="downloadPDF()" class="btn btn-outline" id="pdf-btn">
                    <i class="fa-solid fa-file-pdf"></i> Save Visiting Card (PDF)
                </button>
            </div>
        </div>
    </div>

    <script>
        function downloadVCF() {
            const vcardData = `BEGIN:VCARD\nVERSION:3.0\nN:Yadav;Rishikesh;;;\nFN:Rishikesh Yadav\nORG:Jindal Steel\nTITLE:Low Cost Automation\nTEL;TYPE=CELL,VOICE:+917400569787\nEMAIL;TYPE=WORK:rishikesh.yadav@jindalsteel.in\nEND:VCARD`;
            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'Rishikesh_Yadav.vcf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        async function downloadPDF() {
            const wrapper = document.getElementById("pdf-wrapper");
            const actionButtons = document.getElementById("action-buttons");
            const qrImg = document.getElementById("qr-code-img");
            const pdfBtn = document.getElementById("pdf-btn");

            // Change button text to show loading state
            pdfBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating PDF...';
            
            try {
                // Convert the image to base64 data to bypass browser PDF security blocks
                if (!qrImg.src.startsWith('data:')) {
                    const response = await fetch(qrImg.src);
                    const blob = await response.blob();
                    const dataUrl = await new Promise(resolve => {
                        const reader = new FileReader();
                        reader.onloadend = () => resolve(reader.result);
                        reader.readAsDataURL(blob);
                    });
                    qrImg.src = dataUrl;
                }
            } catch (e) {
                console.error("Image conversion failed, PDF may not render QR code:", e);
            }

            // Hide buttons from the final PDF
            actionButtons.style.display = 'none';

            // Generate PDF
            const opt = {
                margin:       0,
                filename:     'Rishikesh_Yadav_Visiting_Card.pdf',
                image:        { type: 'jpeg', quality: 1 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(wrapper).save().then(() => {
                // Restore buttons
                actionButtons.style.display = 'flex';
                pdfBtn.innerHTML = '<i class="fa-solid fa-file-pdf"></i> Save Visiting Card (PDF)';
            }).catch(err => {
                actionButtons.style.display = 'flex';
                pdfBtn.innerHTML = '<i class="fa-solid fa-file-pdf"></i> Save Visiting Card (PDF)';
                alert("Error generating PDF.");
            });
        }
    </script>
</body>
</html>
